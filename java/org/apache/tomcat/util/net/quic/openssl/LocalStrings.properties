quicEndpoint.idleTimeoutRejected=The configured QUIC idle timeout of [{0}]ms could not be applied to a connection because its transport parameters were already generated. OpenSSL''s QUIC implementation applies its own default of [{1}]ms instead, so this endpoint is not honoring the configured idle timeout. Reconfigure the idle timeout to [{1}]ms, or ignore this warning if the value is not important; it is logged once per endpoint.
quicEndpoint.eventHandlingModeRejected=The QUIC connection could not be switched to EXPLICIT event-handling mode, so it keeps the OpenSSL default in which every API call on the object implicitly ticks the whole shared QUIC engine. The endpoint is functionally correct either way - it drives the engine explicitly regardless - but per-call engine walks make every poll loop iteration scale with the number of open connections. This warning indicates an OpenSSL library without the SSL_VALUE_EVENT_HANDLING_MODE support this build expects; it is logged once per endpoint.
quicEndpoint.streamLimitMismatch=The configured application protocol concurrent stream limit [{0}] differs from the limit advertised by the QUIC transport [{1}]. The OpenSSL QUIC implementation fixes the transport parameters (initial_max_streams_bidi / initial_max_streams_uni) and does not allow them to be configured, so the peer always sees the transport value. Streams beyond the configured limit are only refused after they have been accepted (with an application protocol notification, e.g. HTTP/3 GOAWAY), so a client may still open streams up to the transport limit.
